<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <form action="/server">
        <!-- <label>Username
            <input type="text" placeholder="username">
        </label> -->

        <!-- Classical Approach: Label -->
        <label for="username">Username:</label>
        <input type="text" id="username" placeholder="Enter username" name="user"> <br>

        <label for="password">Password:</label>
        <input type="password" id="password" placeholder="Enter password" name="pass"> <br>

        <!-- <input type="button" value="Click Me!" /> -->  <!-- Button using input element -->
        <!-- <input type="submit"> -->  <!-- Submit Button using input element -->

        <button type="submit">Submit</button>
    </form>

    <hr>

    <form action="https://www.youtube.com/results">
        <input type="text" placeholder="search in youtube" name="search_query">
        <button>Search</button>
    </form> <hr>

    <!-- Que. 8: Google - Create a search option that redirects its search request to google -->
    <form action="https://www.google.com/search">
        <input type="text" placeholder="search in google" name="q">
        <button>Search</button>
    </form> <hr>

    <!-- Checkbox  -->
    <form action="/server">
        <input type="checkbox" id="age" name="age" checked>
        <label for="age"> I am 18+ </label>
        
        <!-- Radio -->
        <input type="radio" name="fruit" id="apple" value="apple">
        <label for="apple">Apple</label>
        <input type="radio" name="fruit" id="banana" value="banana">
        <label for="banana">Banana</label>
        <input type="radio" name="fruit" id="cherry" value="cherry">
        <label for="cherry">Cherry</label> <br>

        <button>Submit</button> <br>
    </form>
</body>
</html>
